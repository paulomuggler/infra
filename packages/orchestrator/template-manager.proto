syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "https://github.com/e2b-dev/infra/template-manager";


message InitLayerFileUploadRequest {
  string templateID = 1;
  string hash = 2;
  optional string cacheScope = 3;
}

message InitLayerFileUploadResponse{
  bool present = 1;
  optional string url = 2;
}

message TemplateStep {
  string type = 1;
  repeated string args = 2;
  optional bool force = 3;

  optional string filesHash = 4;
}

message FromTemplateConfig {
  string alias = 1;

  string buildID = 2;
}

// AWS ECR registry authentication
message AWSRegistry {
  string awsAccessKeyId = 1;
  string awsSecretAccessKey = 2;
  string awsRegion = 3;
}

// GCP registry authentication
message GCPRegistry {
  string serviceAccountJson = 1;
}

// General registry authentication with username/password
message GeneralRegistry {
  string username = 1;
  string password = 2;
}

// Docker registry authentication configuration
message FromImageRegistry {
  oneof type {
    AWSRegistry aws = 1;
    GCPRegistry gcp = 2;
    GeneralRegistry general = 3;
  }
}

message TemplateConfig {
  string templateID = 1;
  string buildID = 2;

  int32 memoryMB = 3;
  int32 vCpuCount = 4;
  int32 diskSizeMB = 5;

  string kernelVersion = 6;
  string firecrackerVersion = 7;
  string startCommand = 8;
  bool hugePages = 9;

  string readyCommand = 10;

  optional bool force = 12;
  repeated TemplateStep steps = 13;

  oneof source {
     string fromImage = 11;
     FromTemplateConfig fromTemplate = 14;
   }

  optional FromImageRegistry fromImageRegistry = 15;

  string teamID = 16;
}

message TemplateCreateRequest {
  TemplateConfig template = 1;
  optional string cacheScope = 2;
  optional string version = 3;
  // Which of this build's layers persist their VM RAM image: "leaf-only"
  // (default) or "all-layers". Unset falls back to the builder's
  // TEMPLATE_SNAPSHOT_POLICY setting.
  optional string snapshotPolicy = 4;
}

enum LogLevel {
    Debug = 0;
    Info = 1;
    Warn = 2;
    Error = 3;
}

enum LogsDirection {
  Forward = 0;
  Backward = 1;
}

message TemplateStatusRequest {
  string templateID = 1;
  string buildID = 2;
  optional int32 offset = 3;
  optional LogLevel level = 4;
  optional uint32 limit = 5;

  optional google.protobuf.Timestamp start = 6;
  optional google.protobuf.Timestamp end = 7;
  optional LogsDirection direction = 8;
}

// Data required for a template-storage collection run.
//
// Storage GC is reachability-based: a build directory survives only if it is
// transitively reachable, through parsed header block mappings, from one of the
// roots supplied here. The caller (the API) is the authority on which builds the
// registry considers live; the builder unions its own live state on top before
// deleting anything.
message TemplateStorageCollectRequest {
  // Build IDs the registry considers live. Must be non-empty: an empty root
  // set is indistinguishable from a failed registry read.
  repeated string rootBuildIDs = 1;
  // Report what would be collected without deleting anything.
  bool dryRun = 2;
  // Directories modified more recently than this are never collected. Unset
  // falls back to the builder's TEMPLATE_GC_MIN_AGE setting.
  optional uint64 minAgeSeconds = 3;
  // Recorded in the ledger and the log line, e.g. "supersede:<buildID>".
  optional string reason = 4;
}

message TemplateStorageCollectResponse {
  string runID = 1;
  uint64 scannedDirs = 2;
  uint64 rootBuilds = 3;
  uint64 keptDirs = 4;
  uint64 collectedDirs = 5;
  uint64 freedBytes = 6;
  uint64 skippedRecentDirs = 7;
  uint64 danglingRefs = 8;
  uint64 prunedIndexBlobs = 9;
  repeated string missingRoots = 10;
  // Roots whose reference closure contains a dangling reference. They are kept
  // regardless -- a broken root is still a root -- and reported so the
  // deliberate repair sweep has an inventory.
  repeated string brokenRoots = 11;
  string ledgerPath = 12;
}

// Data required for deleting a template.
message TemplateBuildDeleteRequest {
  string buildID = 1;
  string templateID = 2;
}

message TemplateBuildMetadata {
  int32 rootfsSizeKey = 1;
  string envdVersionKey = 2;
}

enum TemplateBuildState {
  Building = 0;
  Failed = 1;
  Completed = 2;
}

message TemplateBuildLogEntry {
  google.protobuf.Timestamp timestamp = 1;
  string message = 2;
  LogLevel level = 3;
  map<string, string> fields = 4;
}

message TemplateBuildStatusReason {
  string message = 1;
  optional string step = 2;
}

// Logs from template build
message TemplateBuildStatusResponse {
  reserved 3, 4;

  TemplateBuildState status = 1;
  TemplateBuildMetadata metadata = 2;
  repeated TemplateBuildLogEntry logEntries = 5;

  optional TemplateBuildStatusReason reason = 6;
}

// Interface exported by the server.
service TemplateService {
  // TemplateCreate is a gRPC service that creates a new template
  rpc TemplateCreate (TemplateCreateRequest) returns (google.protobuf.Empty);

  // TemplateStatus is a gRPC service that streams the status of a template build
  rpc TemplateBuildStatus (TemplateStatusRequest) returns (TemplateBuildStatusResponse);

  // TemplateBuildDelete is a gRPC service that deletes files associated with a template build
  rpc TemplateBuildDelete (TemplateBuildDeleteRequest) returns (google.protobuf.Empty);

  // TemplateStorageCollect reclaims template-storage build directories that are
  // no longer reachable from any live root.
  rpc TemplateStorageCollect (TemplateStorageCollectRequest) returns (TemplateStorageCollectResponse);

  // InitLayerFileUpload requests an upload URL for a tar file containing layer files to be cached for the template build.
  rpc InitLayerFileUpload (InitLayerFileUploadRequest) returns (InitLayerFileUploadResponse);
}
